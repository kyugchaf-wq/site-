            </div>
            <ul class="list-group list-group-flush">

                    <img src="src/img/Logo_Instagram.jpeg" alt="Instagram" class="icono-red">

                <li class="list-group-item d-flex align-items-center gap-2">
                    <img src="src/img/Logo_X.jpeg" alt="X" class="icono-red">

                <li class="list-group-item d-flex align-items-center gap-2">
                    <img src="src/img/Logo_Email.jpeg" alt="Email" class="icono-red">

            <div class="card shadow-sm mb-3">
                <div class="card-body">

            <div class="card-body">
                <h5 class="card-title">Últimos Posts</h5>
